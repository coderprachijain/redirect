<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting to Necesories</title>
  <script>
    (function () {
      var destination = "https://necesories.com"
        + window.location.pathname
        + window.location.search
        + window.location.hash;
      window.location.replace(destination);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://necesories.com">
</head>
<body>
  <p>Redirecting to <a href="https://necesories.com">necesories.com</a>…</p>
</body>
</html>
